suite: env Secret (_secret.tpl tpl.secret.env)
templates:
  - templates/stack.yaml
release:
  name: rel
  namespace: default
# Selected by a base64 data key, since the env Secret and env ConfigMap share a name.
tests:
  - it: base64-encodes every value, marks the Secret Opaque and applies additional-wins precedence
    values:
      - ../values/env-precedence.yaml
    asserts:
      - isKind:
          of: Secret
        documentSelector:
          # base64("s3cr3t")
          path: data.DB_PASSWORD
          value: "czNjcjN0"
      - equal:
          path: type
          value: Opaque
        documentSelector:
          path: data.DB_PASSWORD
          value: "czNjcjN0"
      - equal:
          path: metadata.name
          value: rel-shop-api-main-env
        documentSelector:
          path: data.DB_PASSWORD
          value: "czNjcjN0"
      - equal:
          path: data
          value:
            # base64("s3cr3t") -- from the templated string block
            DB_PASSWORD: "czNjcjN0"
            # base64("api-key-value") -- from additionalSecretEnvs
            API_KEY: "YXBpLWtleS12YWx1ZQ=="
            # base64("from-additional") -- additional wins over the base block
            SECRET_PRECEDENCE: "ZnJvbS1hZGRpdGlvbmFs"
        documentSelector:
          path: data.DB_PASSWORD
          value: "czNjcjN0"

  - it: applies the same precedence for a map-form secret block
    values:
      - ../values/env-precedence.yaml
    asserts:
      - equal:
          path: data
          value:
            # base64("additional-wins")
            WORKER_TOKEN: "YWRkaXRpb25hbC13aW5z"
        documentSelector:
          path: data.WORKER_TOKEN
          value: "YWRkaXRpb25hbC13aW5z"
      - equal:
          path: metadata.name
          value: rel-shop-api-worker-env
        documentSelector:
          path: data.WORKER_TOKEN
          value: "YWRkaXRpb25hbC13aW5z"

  - it: tpl-evaluates secret values, including sibling lookups
    values:
      - ../values/siblings.yaml
    asserts:
      - equal:
          path: data
          value:
            # base64("kb-shared-secret")
            KB_SECRET: "a2Itc2hhcmVkLXNlY3JldA=="
        documentSelector:
          path: data.KB_SECRET
          value: "a2Itc2hhcmVkLXNlY3JldA=="

  - it: renders no env Secret when a container declares no secret env
    asserts:
      - hasDocuments:
          count: 4
