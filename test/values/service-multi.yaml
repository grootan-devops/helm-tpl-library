# Extra service keys, named-port dedup into container ports, headless service.
service:
  default:
    annotations:
      service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    spec:
      type: LoadBalancer
      ports:
        - name: http
          port: 80
          targetPort: 8080
          protocol: TCP
        - name: metrics
          port: 9090
          targetPort: 9090
          protocol: TCP
  headless:
    annotations: {}
    spec:
      clusterIP: None
      ports:
        - name: grpc
          port: 50051
          targetPort: 50051
          protocol: TCP
        # Duplicate port name across services: the container must list it once.
        - name: http
          port: 80
          targetPort: 8080
          protocol: TCP
