suite: service account (_sa.tpl)
templates:
  - templates/stack.yaml
release:
  name: rel
  namespace: default
tests:
  - it: creates nothing by default
    asserts:
      - hasDocuments:
          count: 4

  - it: creates the ServiceAccount and its paired token Secret
    values:
      - ../values/serviceaccount.yaml
    asserts:
      # Service, Deployment, Ingress, HTTPRoute, ServiceAccount, token Secret.
      - hasDocuments:
          count: 6
      - equal:
          path: metadata.name
          value: rel-shop-api
        documentSelector:
          path: kind
          value: ServiceAccount
      - equal:
          path: metadata.annotations
          value:
            eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/shop-api
        documentSelector:
          path: kind
          value: ServiceAccount
      - equal:
          path: secrets
          value:
            - name: rel-shop-api-token
        documentSelector:
          path: kind
          value: ServiceAccount
      - equal:
          path: type
          value: kubernetes.io/service-account-token
        documentSelector:
          path: metadata.name
          value: rel-shop-api-token
      - equal:
          path: metadata.annotations["kubernetes.io/service-account.name"]
          value: rel-shop-api
        documentSelector:
          path: metadata.name
          value: rel-shop-api-token
