suite: prometheus monitors (_metrics.tpl)
templates:
  - templates/monitors.yaml
release:
  name: rel
  namespace: default
tests:
  - it: renders nothing while global.metrics.enabled is false
    values:
      - ../values/metrics-disabled.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: renders a ServiceMonitor and a PodMonitor when metrics are on
    values:
      - ../values/metrics.yaml
    asserts:
      - hasDocuments:
          count: 2
      - isAPIVersion:
          of: monitoring.coreos.com/v1
        documentSelector:
          path: kind
          value: ServiceMonitor
      - equal:
          path: metadata.name
          value: rel-shop-api
        documentSelector:
          path: kind
          value: ServiceMonitor
      - equal:
          path: spec.endpoints
          value:
            - port: http-metrics
              path: /metrics
              interval: 15s
              scrapeTimeout: 10s
        documentSelector:
          path: kind
          value: ServiceMonitor
      - equal:
          path: spec.jobLabel
          value: app-service
        documentSelector:
          path: kind
          value: ServiceMonitor
      - equal:
          path: spec.namespaceSelector.matchNames
          value: [default]
        documentSelector:
          path: kind
          value: ServiceMonitor
      - equal:
          path: metadata.labels.release
          value: kube-prometheus-stack
        documentSelector:
          path: kind
          value: ServiceMonitor

  - it: puts the same endpoints under podMetricsEndpoints on the PodMonitor
    values:
      - ../values/metrics.yaml
    asserts:
      - equal:
          path: spec.podMetricsEndpoints
          value:
            - port: http-metrics
              path: /metrics
              interval: 15s
              scrapeTimeout: 10s
        documentSelector:
          path: kind
          value: PodMonitor
      - equal:
          path: spec.selector.matchLabels
          value:
            app.kubernetes.io/name: rel-shop-api
            app.kubernetes.io/instance: rel
            app.kubernetes.io/service: rel-shop-api
        documentSelector:
          path: kind
          value: PodMonitor
