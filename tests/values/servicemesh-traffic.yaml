component: backend

serviceMesh:
  enabled: true
  type: istio
  istio:
    destinationRules:
      - name: backend-policy
        trafficPolicy:
          loadBalancer:
            simple: LEAST_REQUEST
          connectionPool:
            tcp:
              maxConnections: 100
              connectTimeout: 3s
            http:
              http1MaxPendingRequests: 50
          outlierDetection:
            consecutive5xxErrors: 3
            interval: 10s
            baseEjectionTime: 30s
        subsets:
          - name: v1
            labels:
              version: v1
          - name: v2
            labels:
              version: v2
    externalServices:
      - host:
          - httpbin.org
          - example.com
