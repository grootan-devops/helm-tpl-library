# betterleaks / gitleaks configuration.
# These files contain deliberately synthetic values used to exercise Helm
# rendering and secret propagation. They are not credentials.

[extend]
useDefault = true

[[allowlists]]
description = "Synthetic Helm fixture values"
targetRules = ["generic-password", "generic-api-key"]
paths = [
  '''^example\.yaml$''',
  '''^tests?/.*$''',
]
