suite: cronjob (_cronjob.tpl)
templates:
  - templates/cronjob.yaml
release:
  name: rel
  namespace: default
tests:
  - it: renders the CronJob with its schedule and history settings
    values:
      - ../values/job-cronjob.yaml
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: CronJob
      - isAPIVersion:
          of: batch/v1
      - equal:
          path: metadata.name
          value: rel-shop-api-nightly
      - equal:
          path: spec.schedule
          value: "0 2 * * *"
      - equal:
          path: spec.concurrencyPolicy
          value: Forbid
      - equal:
          path: spec.startingDeadlineSeconds
          value: 300
      - equal:
          path: spec.successfulJobsHistoryLimit
          value: 3
      - equal:
          path: spec.failedJobsHistoryLimit
          value: 1
      - equal:
          path: spec.suspend
          value: false
      - equal:
          path: spec.timeZone
          value: Asia/Riyadh
      - equal:
          path: spec.ttlSecondsAfterFinished
          value: 3600

  - it: passes the job template settings into jobTemplate.spec
    values:
      - ../values/job-cronjob.yaml
    asserts:
      - equal:
          path: spec.jobTemplate.spec.backoffLimit
          value: 2

  - it: reuses the workload containers for the cronjob pod
    values:
      - ../values/job-cronjob.yaml
    asserts:
      - equal:
          path: spec.jobTemplate.spec.template.spec.containers[0].name
          value: shop-api-main
      - equal:
          path: spec.jobTemplate.spec.template.spec.containers[0].image
          value: "cr.io/acme/shop-api:1.4.2"
      # Unlike tpl.job, the cronjob does NOT blank the service, so ports are inherited.
      - equal:
          path: spec.jobTemplate.spec.template.spec.containers[0].ports
          value:
            - containerPort: 8080
              name: http
              protocol: TCP

  - it: labels the CronJob and its pod template with the cronjob name segment
    values:
      - ../values/job-cronjob.yaml
    asserts:
      - equal:
          path: metadata.labels["app.kubernetes.io/name"]
          value: rel-shop-api-nightly
      - equal:
          path: spec.jobTemplate.spec.template.metadata.labels["app.kubernetes.io/name"]
          value: rel-shop-api-nightly

  - it: renders nothing while the fixture switch is off
    asserts:
      - hasDocuments:
          count: 0
